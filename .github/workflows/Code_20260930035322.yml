name: 云编译 · ZIP 解压后生成未签名 IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

concurrency:
  group: ipa-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 查看可用 Xcode
        run: ls /Applications | grep -i xcode || echo "no-xcode"

      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 找到并解压 JevJarvis ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"
          if [ -z "${ZIP_FILE}" ]; then
            echo "::error::没有找到 ZIP 文件"
            exit 1
          fi
          echo "===== 文件名 ====="
          ls -lh "${ZIP_FILE}"
          echo "===== 解压全部内容清单（顶层5层） ====="
          rm -rf extracted && mkdir -p extracted
          unzip -q "${ZIP_FILE}" -d extracted
          find extracted -maxdepth 5 | sort
          echo ""
          echo "===== 重点搜索：工程文件 ====="
          find extracted -maxdepth 6 \( -iname '*.xcodeproj' -o -iname '*.xcworkspace' -o -iname '*.pbxproj' \) | sort
          echo ""
          echo "===== 搜索：源码入口 ====="
          find extracted -maxdepth 6 \( -iname 'AppDelegate.swift' -o -iname 'JevJarvisApp.swift' -o -iname '*.entitlements' \) | sort
          echo ""
          echo "===== 搜索：依赖管理 ====="
          find extracted -maxdepth 6 \( -iname 'Podfile' -o -iname 'Package.swift' -o -iname 'Cartfile' \) | sort
          echo ""
          echo "::notice::【诊断模式】请到日志中查看以上清单，确认工程结构"
          exit 1

      - name: 查看工具链
        run: |
          xcodebuild -version
          swift --version

      - name: 编译 App + 键盘扩展（不签名）
        working-directory: build_src
        run: |
          set -euo pipefail
          xcodebuild -project JevJarvis.xcodeproj -scheme JevJarvis \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            build 2>&1 | tee build.log
          echo ""
          echo "===== 编译错误汇总 ====="
          grep -nE "error:" build.log | head -40 || echo "日志中无 error: 行"
          echo "----- 链接/依赖相关 -----"
          grep -inE "ld: |undefined symbol|missing|not found|framework not|no such module" build.log | head -40 || true

      - name: 组装未签名 IPA
        working-directory: build_src
        run: |
          set -euo pipefail
          APP="$(find DerivedData -type d -name 'JevJarvis.app' | head -n 1)"
          if [ -z "${APP}" ] || [ ! -d "${APP}" ]; then
            echo "::error::找不到编译产物 JevJarvis.app"
            find DerivedData -maxdepth 6 -type d -name '*.app' || true
            exit 1
          fi
          echo "使用 App 包：${APP}"
          rm -rf Payload JevJarvis-unsigned.ipa
          mkdir -p Payload
          cp -R "${APP}" Payload/
          zip -qr JevJarvis-unsigned.ipa Payload
          ls -lh JevJarvis-unsigned.ipa

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: JevJarvis-unsigned-ipa
          path: build_src/JevJarvis-unsigned.ipa
          if-no-files-found: error
