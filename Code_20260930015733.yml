name: 云编译 · ZIP 解压后生成未签名 IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 选择 Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer

      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 找到并解压 JevJarvis ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [ -z "${ZIP_FILE}" ]; then
            echo "没有找到 ZIP 文件"
            exit 1
          fi
          echo "使用：${ZIP_FILE}"
          rm -rf extracted
          mkdir -p extracted
          unzip -q "${ZIP_FILE}" -d extracted

          ROOT="$(find extracted -mindepth 1 -maxdepth 1 -type d -name 'jev-chat-jarvis-ios' -print -quit)"
          if [ -z "${ROOT}" ]; then
            ROOT="$(find extracted -mindepth 1 -maxdepth 4 -type f -name 'JevJarvis.xcodeproj' -print -quit | xargs -r dirname)"
          fi
          if [ -z "${ROOT}" ] || [ ! -f "${ROOT}/JevJarvis.xcodeproj/project.pbxproj" ]; then
            echo "无法在 ZIP 中找到 JevJarvis.xcodeproj"
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          rm -rf build_src
          mkdir -p build_src
          cp -R "${ROOT}/." build_src/

      - name: 查看工具链
        run: |
          xcodebuild -version
          swift --version

      - name: 编译 App + 键盘扩展（不签名）
        working-directory: build_src
        run: |
          xcodebuild             -project JevJarvis.xcodeproj             -scheme JevJarvis             -configuration Release             -destination 'generic/platform=iOS'             -derivedDataPath build             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=''             build

      - name: 组装未签名 IPA
        working-directory: build_src
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/JevJarvis.app"
          if [ ! -d "${APP}" ]; then
            echo "找不到编译产物：${APP}"
            find build/Build/Products -maxdepth 4 -print || true
            exit 1
          fi

          rm -rf Payload JevJarvis-unsigned.ipa
          mkdir -p Payload
          cp -R "${APP}" Payload/
          zip -qr JevJarvis-unsigned.ipa Payload
          ls -lh JevJarvis-unsigned.ipa

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: JevJarvis-unsigned-ipa
          path: build_src/JevJarvis-unsigned.ipa
          if-no-files-found: error
